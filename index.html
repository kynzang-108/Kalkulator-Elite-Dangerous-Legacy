<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator pilota</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1220;--panel:#111c30;--line:#24385a;--text:#d9e4f5;--dim:#8196b8;--hud:#ff8a1f;--ok:#4fd6b0;--bad:#ff5a5a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,#16294a 0%,var(--bg) 60%) var(--bg);color:var(--text);font-family:'Chakra Petch',system-ui,sans-serif;line-height:1.4;overflow:hidden}
.app{height:100%;max-width:980px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
h1{font-size:1.25rem;margin:0;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:2px 10px 2px 10px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
nav button[aria-selected=true]{color:#1a1006;background:var(--hud);border-color:var(--hud);font-weight:600}
nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hud);outline-offset:1px}
.pane{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane[hidden]{display:none}
@media(max-width:700px){.pane{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.in{border:1px solid var(--line);background:var(--panel);border-radius:2px 14px 2px 14px;padding:12px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-content:start}
@media(max-width:700px){.in{grid-template-columns:1fr 1fr}}
label{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:.78rem}
input,select{width:100%;background:#0a1220;border:1px solid var(--line);color:var(--text);padding:5px 7px;border-radius:2px;font:inherit;font-size:.95rem}
.out{border:1px solid var(--hud);border-radius:2px 14px 2px 14px;padding:14px;background:linear-gradient(135deg,#1b1a1f,var(--panel));overflow:auto}
.big{font-size:clamp(2rem,7vw,3.2rem);font-weight:600;color:var(--hud);line-height:1}
.big small{font-size:.85rem;color:var(--dim);margin-left:6px;font-weight:400}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.rows div{border-top:1px solid var(--line);padding-top:4px}
.rows b{display:block;font-size:1.05rem;font-weight:600}
.rows span{color:var(--dim);font-size:.78rem}
.v{margin-top:10px;font-weight:600;font-size:.9rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.note{color:var(--dim);font-size:.72rem;margin-top:8px}
</style>
</head>

<div id="panes" style="flex:1;min-height:0;display:flex"></div>

  const m0=v.hull+v.cargo+v.fuel;let fu=v.fuel,left=v.dist,j=0,used=0,stuck=false;
  while(left>.001&&j<2000){const m=v.hull+v.cargo+fu,mx=rng(m,fu);if(mx<=.01){stuck=true;break}
   const d=Math.min(left,v.jump>0?Math.min(v.jump,mx):mx),c=Math.min(v.maxf,v.lin*.001*Math.pow(d*m/v.opt,v.pw));
   if(c>fu+1e-9){stuck=true;break}fu-=c;used+=c;left-=d;j++}
  return{big:[f(v.fuel?rng(m0,v.fuel):0),'LY maks. zasięg'],rows:[['Masa całkowita (t)',f(m0)],['Skoków',j],['Paliwo na trasę (t)',f(used,2)],['Paliwo po trasie (t)',f(fu,2)]],

{id:'dps',name:'DPS i energia',note:'Ładowanie kondensatora liczone liniowo od pipów (0,4 do 2,0). Wartość przybliżona.',

{id:'ehp',name:'Efektywne HP',note:'Odporności w procentach (np. 40). Wynik: ile obrażeń danego typu wytrzymasz.',
 fields:[['sh','Tarcze (HP)',900],['hu','Kadłub (HP)',1300],['sk','Odp. tarcz kinet. %',40],['st','Odp. tarcz term. %',-20],['se','Odp. tarcz wybuch. %',50],['hk','Odp. kadłuba kinet. %',20],['ht','Odp. kadłuba term. %',0],['he','Odp. kadłuba wybuch. %',-40]],

{id:'pow',name:'Bilans mocy',note:'Wpisz pobór modułów w MW z Outfittingu.',

{id:'trade',name:'Handel',note:'Ceny z archiwalnej wiki (Legacy): średnia galaktyczna towaru. Marże kupna i sprzedaży to Twoje założenie, popraw je według cen na stacjach. Czas skoku wlicza skan, ładowanie FSD i lądowanie.',
 fields:[['avg','Towar (średnia galaktyczna, CR)',9742,[["Advanced Catalysers (3 055)", 3055], ["Agri-Medicines (1 154)", 1154], ["Algae (200)", 200], ["Aluminium (412)", 412], ["Animal Meat (1 460)", 1460], ["Animal Monitors (378)", 378], ["Aquaponic Systems (349)", 349], ["Atmospheric Processors (493)", 493], ["Auto Fabricators (3 937)", 3937], ["Basic Medicines (395)", 395], ["Battle Weapons (7 031)", 7031], ["Bauxite (216)", 216], ["Beer (240)", 240], ["Bertrandite (2 694)", 2694], ["Beryllium (8 549)", 8549], ["Bio Reducing Lichen (1 089)", 1089], ["Biowaste (74)", 74], ["Chemical Waste (79)", 79], ["Clothing (395)", 395], ["Cobalt (823)", 823], ["Coffee (1 460)", 1460], ["Coltan (1 550)", 1550], ["Combat Stabilisers (3 055)", 3055], ["Computer Components (631)", 631], ["Consumer Technology (7 031)", 7031], ["Copper (570)", 570], ["Crop Harvesters (2 378)", 2378], ["Domestic Appliances (631)", 631], ["Explosives (378)", 378], ["Fish (493)", 493], ["Food Cartridges (206)", 206], ["Fruit and Vegetables (395)", 395], ["Gallite (2 101)", 2101], ["Gallium (5 426)", 5426], ["Gold (9 742)", 9742], ["Grain (275)", 275], ["H.E. Suits (349)", 349], ["Hydrogen Fuel (147)", 147], ["Imperial Slaves (16 485)", 16485], ["Indite (2 378)", 2378], ["Indium (6 175)", 6175], ["Land Enrichment Systems (5 088)", 5088], ["Leather (240)", 240], ["Lepidolite (700)", 700], ["Liquor (738)", 738], ["Lithium (1 749)", 1749], ["Marine Equipment (4 474)", 4474], ["Microbial Furnaces (266)", 266], ["Mineral Extractors (700)", 700], ["Mineral Oil (259)", 259], ["Narcotics (240)", 240], ["Natural Fabrics (493)", 493], ["Non-Lethal Weapons (1 976)", 1976], ["Palladium (13 527)", 13527], ["Performance Enhancers (7 031)", 7031], ["Personal Weapons (4 474)", 4474], ["Pesticides (292)", 292], ["Platinum (18 814)", 18814], ["Polymers (216)", 216], ["Power Generators (631)", 631], ["Progenitor Cells (7 031)", 7031], ["Reactive Armour (2 235)", 2235], ["Resonating Separators (6 175)", 6175], ["Robotics (1 976)", 1976], ["Rutile (412)", 412], ["Scrap (96)", 96], ["Semiconductors (1 029)", 1029], ["Silver (5 088)", 5088], ["Slaves (11 107)", 11107], ["Superconductors (7 031)", 7031], ["Synthetic Fabrics (252)", 252], ["Synthetic Meat (324)", 324], ["Tantalum (4 196)", 4196], ["Tea (1 646)", 1646], ["Titanium (1 154)", 1154], ["Tobacco (5 088)", 5088], ["Uraninite (1 029)", 1029], ["Uranium (2 869)", 2869], ["Water Purifiers (378)", 378], ["Wine (324)", 324]]],['t','Ładunek (t)',400],['bm','Kupno taniej od średniej (%)',10],['sm','Sprzedaż drożej od średniej (%)',15],['j','Skoków w jedną stronę',6],['min','Minut na skok',2],['dock','Minut na handel',6]],
 calc(v){const buy=v.avg*(1-v.bm/100),sell=v.avg*(1+v.sm/100),p=(sell-buy)*v.t,m=v.j*v.min*2+v.dock;

  ver:p<=0?['bad','Ten kurs przynosi stratę.']:['ok','Koszt ładunku: '+cr(buy*v.t)+'. Zysk na skok: '+cr(p/Math.max(1,v.j*2))+'.']}}},
{id:'rebuy',name:'Rebuy',note:'Standardowe ubezpieczenie to 5% wartości statku i modułów.',
 fields:[['ship','Wartość statku (CR)',124000000],['mods','Wartość modułów (CR)',60000000],['pct','Ubezpieczenie %',5],['car','Wartość ładunku (CR)',0],['bal','Twoje konto (CR)',150000000]],
 calc(v){const r=(v.ship+v.mods)*v.pct/100,l=r+v.car;
  return{big:[f(r,0),'CR rebuy'],rows:[['Strata z ładunkiem',cr(l)],['Wartość floty',cr(v.ship+v.mods)],['Konto po stracie',cr(v.bal-l)],['Stać na rebuy',v.bal>=r?'tak':'nie']],
  ver:v.bal<r?['bad','Nie masz na rebuy. Lataj ostrożniej.']:['ok','Konto pokrywa rebuy.']}}},
{id:'exp',name:'Eksploracja',note:'Ceny to bazowa wartość skanu z wiki Elite Dangerous. Realna kwota zależy od masy ciała. Mapowanie DSS (około ×3) liczone tylko dla trzech pierwszych typów, pierwsze odkrycie (×2,6) dla wszystkich.',
 fields:[['e1','Ziemiopodobny (ELW), 270 290 CR',1],['e2','Wodny, 99 747 CR',2],['e3','Wodny terraformowalny, 268 616 CR',1],['e4','Gaz. olbrzym klasy II, 28 405 CR',1],['e5','Gaz. olbrzym klasy I, 3 845 CR',2],['e6','Gaz. olbrzym klasy III-V, ok. 1 000 CR',3],['e7','Inne olbrzymy (wodne, helowe), ok. 800 CR',2],['e8','Skalne i lodowe, ok. 300 CR',20],['map','Zmapowane sondą DSS?',3,[['Nie',1],['Tak',3]]],['fd','Jesteś pierwszym odkrywcą?',2.6,[['Nie',1],['Tak',2.6]]]],
 calc(v){const hi=v.e1*270290+v.e2*99747+v.e3*268616,lo=v.e4*28405+v.e5*3845+v.e6*1000+v.e7*800+v.e8*300,w=(hi*v.map+lo)*v.fd,c=v.e1+v.e2+v.e3+v.e4+v.e5+v.e6+v.e7+v.e8;
  return{big:[f(w,0),'CR do zarobienia'],rows:[['Z cennych (ELW i wodne)',cr(hi*v.map*v.fd)],['Z olbrzymów i reszty',cr(lo*v.fd)],['Liczba ciał',f(c,0)],['Średnio na ciało',cr(w/Math.max(1,c))]],
  ver:['ok','Dane sprzedasz w stacji z Universal Cartographics.']}}},
{id:'eng',name:'Inżynierowie',note:'Wymagania z wiki Elite Dangerous. Współrzędne z pliku systemów (stan 2022, tylko zaludnione). Wpisz nazwę swojego systemu i wybierz podpowiedź.',
 fields:[['sysn','Twój obecny system','Mainani'],['i','Inżynier',0,EN.map((e,k)=>[e[0]+' ('+e[2]+')',k])]],
 calc(v){const p=SYS.get((v.sysn||'').trim().toLowerCase()),e=EN[v.i||0],c=SYS.get(e[2].toLowerCase()),dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
  if(!p)return{big:['–','nie znaleziono systemu'],rows:[['Specjalizacja',e[4]],['Znajdziesz u',e[7]],['Zaproszenie',e[8]],['Odblokowanie (dostarcz)',e[9]]],ver:['bad','Nie ma takiego systemu w pliku. Sprawdź pisownię (tylko zaludnione systemy).']};
  let best=null;EN.forEach(x=>{const q=SYS.get(x[2].toLowerCase());if(q){const k=dd(p,q);if(!best||k<best[0])best=[k,x[0],x[2]]}});
  const d=dd(p,c);
  return{big:[f(d,1),'LY do '+e[0]+' ('+e[2]+')'],rows:[['Specjalizacja',e[4]],['Znajdziesz u',e[7]],['Zaproszenie',e[8]],['Odblokowanie (dostarcz)',e[9]],['Region i baza',e[3]+', '+e[1]],['Najbliższy inżynier',best[1]+', '+f(best[0],1)+' LY']],
  ver:(c[4]||e[6])?['bad','System inżyniera wymaga zezwolenia (permit).']:['ok','System inżyniera nie wymaga zezwolenia.']}}},
{id:'mat',name:'Materiały',note:'Surowe, wytworzone i kodowane (wiki Elite Dangerous). Potwierdzeni traderzy z pliku Legacy (80 stacji) oraz przypuszczalni surowi (z Twojego Station Finder, słabe dopasowanie wg gospodarki). Wszystkie z dużym lądowiskiem L. Wymieniasz w obrębie jednej linii.',
 fields:[['loc','Twój obecny system','Mainani'],['rng','Zasięg lotu',500,[['10 LY',10],['50 LY',50],['100 LY',100],['250 LY',250],['500 LY',500],['Bez limitu',100000]]],['sl','Lokalizacja stacji',0,[['Dowolna',0],['Orbita (stacja kosmiczna)',1],['Planeta',2]]],['lsm','Odległość od gwiazdy',1000000000,[['Dowolna',1000000000],['do 100 ls',100],['do 500 ls',500],['do 1 000 ls',1000],['do 5 000 ls',5000]]],['sr','Źródło danych',0,[['Także przypuszczalne',0],['Tylko potwierdzone',1]]],['mt','Rodzaj materiału',0,[['Surowe',0],['Wytworzone',1],['Kodowane',2]]],['m','Materiał',0,MA.map((m,k)=>[m,k]).filter(x=>x[0][4]==='R').map(([m,k])=>[m[0]+' (st. '+m[2]+')',k])],['need','Potrzebujesz (szt.)',10],['have','Masz (szt.)',3]],
 calc(v){const m=MA[v.m||0],b=Math.max(0,v.need-v.have),p=SYS.get((v.loc||'').trim().toLowerCase());
  const kind=x=>/Planetary/.test(x[5])?'P':x[5]?'O':'?';
  const near=t=>{if(!p)return '–';let L=[];TR.forEach(x=>{if(x[2]!==t)return;if(v.sr==1&&x[6]!=='C')return;const k=kind(x);if(v.sl==1&&k!=='O')return;if(v.sl==2&&k!=='P')return;if(v.lsm<1e9&&(x[4]==null||x[4]>v.lsm))return;const q=SYS.get(x[0].toLowerCase());if(!q)return;L.push([Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]),x])});L.sort((a,b)=>a[0]-b[0]);L=L.filter(a=>a[0]<=v.rng);
   return L.length?'Znaleziono: '+L.length+'<br>'+L.slice(0,5).map(([d,x])=>f(d,1)+' LY: '+x[1]+' ('+x[0]+'), '+(x[4]!=null?f(x[4],0)+' ls, ':'')+({O:'orbita',P:'planeta','?':'lokalizacja nieznana'})[kind(x)]+(x[5]?' ('+x[5].replace(' Starport','')+')':'')+', pad '+(x[3]||'brak danych')+(x[6]==='G'?' [przypuszczalny]':'')).join('<br>'):'brak stacji w mojej bazie dla tych filtrów (w grze mogą istnieć)'};
  const ord=[m[4],...['R','M','E'].filter(t=>t!==m[4])];
  return{big:[f(b,0),'szt. brakuje'],rows:[['Materiał',m[0]+' (st. '+m[2]+', '+TL[m[4]]+')'],['Linia wymiany',m[4]==='R'?m[1]:m[1]+' (trader '+TN[m[4]]+')'],['Gdzie zdobyć',m[3]],...ord.map((t,i)=>['Najbliższe: '+TN[t]+(i?'':' (do tego materiału)'),near(t)])],
  ver:!p?['bad','Nie znaleziono Twojego systemu. Sprawdź pisownię (tylko zaludnione).']:b>0?['bad','Zdobądź jeszcze '+f(b,0)+' szt. lub wymień niższe stopnie z tej linii.']:['ok','Masz wystarczająco materiału.']}}}
];
const nav=document.getElementById('nav'),panes=document.getElementById('panes');
T.forEach((t,i)=>{
 const b=document.createElement('button');b.textContent=t.name;b.setAttribute('role','tab');b.onclick=()=>show(i);nav.appendChild(b);t.btn=b;
 const p=document.createElement('section');p.className='pane';p.style.flex='1';p.hidden=true;
 p.innerHTML='<div class="in">'+t.fields.map(([k,l,d,o])=>'<label>'+l+(o?'<select data-k="'+k+'">'+o.map(x=>'<option value="'+x[1]+'"'+(x[1]===d?' selected':'')+'>'+x[0]+'</option>').join('')+'</select>':(typeof d==='string'?'<input type="text" list="sys" autocomplete="off" data-k="'+k+'" value="'+d+'">':'<input type="number" data-k="'+k+'" value="'+d+'" step="any">'))+'</label>').join('')+'</div><div class="out" aria-live="polite"><div class="big"></div><div class="rows"></div><div class="v"></div><div class="note">'+t.note+'</div></div>';
 panes.appendChild(p);t.pane=p;
 p.addEventListener('input',e=>{if(e.target.type==='text')hint(e.target.value);run(t)});run(t);if(t.id==='mat')hookMat(t);
});
function hint(q){q=q.trim().toLowerCase();const dl=document.getElementById('sys');dl.innerHTML='';if(q.length<2)return;let n=0;for(const [k,v] of SYS){if(k.startsWith(q)){const o=document.createElement('option');o.value=v[3];dl.appendChild(o);if(++n>=15)break}}}
function hookMat(t){const mt=t.pane.querySelector('[data-k=mt]'),m=t.pane.querySelector('[data-k=m]');
 mt.addEventListener('change',()=>{const c='RME'[mt.value];m.innerHTML=MA.map((x,k)=>[x,k]).filter(([x])=>x[4]===c).map(([x,k])=>'<option value="'+k+'">'+x[0]+' (st. '+x[2]+')</option>').join('');run(t)})}
function run(t){
 const v={};t.pane.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=i.type==='text'?i.value:(parseFloat(i.value)||0));
 const r=t.calc(v),q=s=>t.pane.querySelector(s);
 q('.big').innerHTML=r.big[0]+'<small>'+r.big[1]+'</small>';
 q('.rows').innerHTML=r.rows.map(x=>'<div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
 const e=q('.v');e.className='v '+r.ver[0];e.textContent=r.ver[1];
}
function show(i){T.forEach((t,j)=>{t.pane.hidden=i!==j;t.btn.setAttribute('aria-selected',i===j)})}
show(0);
</script>
